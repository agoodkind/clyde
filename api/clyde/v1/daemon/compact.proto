syntax = "proto3";

package clyde.v1;

option go_package = "goodkind.io/clyde/api/clyde/v1;clydev1";

message CompactStrippers {
  bool thinking = 1;
  bool images = 2;
  bool tools = 3;
  bool chat = 4;
}

message CompactRunRequest {
  string session_name = 1;
  int32 target_tokens = 2;
  int32 reserved_tokens = 3;
  string model = 4;
  bool model_explicit = 5;
  CompactStrippers strippers = 6;
  bool summarize = 7;
  bool force = 8;
  string summarize_mode = 9;
  bool refresh = 10;
  // force_over_target opts out of the Apply over-target refusal gate.
  // When false (default) Apply refuses to mutate the transcript if the
  // planner's final projection exceeds target_tokens. See CLYDE-356.
  bool force_over_target = 11;
}

message CompactUpfront {
  string session_name = 1;
  string session_id = 2;
  string model = 3;
  int32 current_total = 4;
  int32 max_tokens = 5;
  int32 target_tokens = 6;
  int32 static_floor = 7;
  int32 reserved_tokens = 8;
  int32 thinking_blocks = 9;
  int32 image_blocks = 10;
  int32 tool_pairs = 11;
  int32 chat_turns = 12;
  string strippers_text = 13;
  string calibration_date = 14;
  int32 messages_tokens = 15;
  int32 compact_buffer_tokens = 16;
  int32 free_tokens = 17;
  int32 context_overhead_tokens = 18;
  int32 post_boundary_entries = 19;
  bool calibrated = 20;
  int32 calibration_overhead = 21;
  // Upfront supplemental fields. These are populated so clients can
  // display transcript, boundary, and context details without re-reading
  // the transcript or re-running the context usage probe.
  string transcript_path = 22;
  int64 file_size_bytes = 23;
  int32 file_line_count = 24;
  bool has_boundary = 25;
  int32 boundary_line = 26;
  string boundary_uuid = 27;
  string boundary_time = 28;
  int32 usage_percentage = 29;
  bool usage_available = 30;
  string usage_source = 31;
  string usage_captured_at = 32;
  string usage_error = 33;
  repeated CompactUsageCategory usage_categories = 34;
}

message CompactUsageCategory {
  string name = 1;
  int32 tokens = 2;
  bool is_deferred = 3;
}

message CompactIteration {
  int32 iteration = 1;
  string step = 2;
  int32 tail_tokens = 3;
  int32 ctx_total = 4;
  int32 delta = 5;
  bool thinking_dropped = 6;
  bool images_placeholder = 7;
  int32 tools_full = 8;
  int32 tools_line_only = 9;
  int32 tools_dropped = 10;
  int32 chat_turns_total = 11;
  int32 chat_turns_dropped = 12;
  bool probe = 13;
}

message CompactApplyMutation {
  string boundary_uuid = 1;
  string synthetic_uuid = 2;
  int64 pre_apply_offset = 3;
  int64 post_apply_offset = 4;
  string snapshot_path = 5;
  string ledger_path = 6;
}

message CompactFinal {
  int32 baseline_tail = 1;
  int32 final_tail = 2;
  bool hit_target = 3;
  int32 target_tokens = 4;
  int32 static_floor = 5;
  int32 reserved_tokens = 6;
  string transcript_path = 7;
  int32 boundary_tail_blocks = 8;
}

message CompactEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_STATUS = 1;
    KIND_UPFRONT = 2;
    KIND_ITERATION = 3;
    KIND_FINAL = 4;
    KIND_APPLY_MUTATION = 5;
  }

  int32 sequence = 1;
  Kind kind = 2;
  string message = 3;
  CompactUpfront upfront = 4;
  CompactIteration iteration = 5;
  CompactFinal final = 6;
  CompactApplyMutation apply_mutation = 7;
}

message CompactUndoRequest {
  string session_name = 1;
}

message CompactUndoResponse {
  string session_name = 1;
  string session_id = 2;
  string transcript_path = 3;
  string ledger_path = 4;
  string applied_at = 5;
  int32 target_tokens = 6;
  string boundary_uuid = 7;
  string synthetic_uuid = 8;
  string snapshot_path = 9;
  int64 pre_apply_offset = 10;
  int64 post_undo_bytes = 11;
}
