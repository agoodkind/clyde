name: CI

on:
  workflow_dispatch:
  push:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@codex/ci-compiled-go-cache-benchmark
    with:
      golangci_lint_install_mode: goinstall
      cgo: true
      submodules: recursive
      darwin_runner: macos-15
      skip_unchanged: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets: inherit

  project-test:
    name: Project Race Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOCACHE: ${{ github.workspace }}/.make/ci-go-race
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        id: setup-go
        env:
          GOCACHE: ${{ runner.temp }}/setup-go-build
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Cache compiled race packages
        uses: actions/cache@v6
        with:
          path: ${{ env.GOCACHE }}
          key: clyde-race-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile', 'bootstrap.mk', 'third_party/gksyntax/**') }}
      # Prepare the workspace and native dependencies before running go test.
      - name: Native build prerequisites
        run: make native-prereqs
      # Race coverage runs the suites with `go test -race` (Go's own runner)
      # rather than `ginkgo -r --race`. The ginkgo CLI orchestrator wedges after
      # the suites finish on linux/amd64 under -race (reproduced on every CI run,
      # both ginkgo v2.28.1 and v2.29.0; clean on arm64; go test runs the same
      # RunSpecs suites fine), matching ginkgo issue #871. -shuffle=on keeps the
      # randomized-order coverage; -timeout makes any real deadlock fail fast with
      # a full goroutine dump instead of hanging. -count stays at 1 because Ginkgo
      # rejects -count>1 ("Only -count=1 is allowed"), so any higher value fails
      # every RunSpecs package before a test executes.
      - name: Race tests
        env:
          GOTRACEBACK: all
        run: go test -race -shuffle=on -count=1 -timeout=8m ./...
