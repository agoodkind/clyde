name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@main

  project-test:
    name: Project Ginkgo Tests
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Compile the race-instrumented suites first, timed on its own line, so the
      # compile cost is visible separately from the run and this job's Go build
      # cache is warm before the timed run below.
      - name: Compile race suites
        run: time go run github.com/onsi/ginkgo/v2/ginkgo build -r --race
      # A sidecar watchdog finds a genuinely-hung suite by elapsed time and dumps
      # it. Compilation finished in the prior step (cache warm), so any *.test
      # process still running after 120s is a deadlock, not slow compilation.
      # SIGQUIT with GOTRACEBACK=all makes that process print every goroutine
      # stack, which ginkgo relays as the failed suite's output, then SIGKILL
      # backstops so the step exits and the log persists (instead of the runner
      # cap SIGKILLing the whole job and discarding the log). Targeting by PID
      # avoids the process-group pitfalls of `timeout`/`set -m` in CI bash.
      - name: Run race suites
        env:
          GOTRACEBACK: all
        run: |
          go run github.com/onsi/ginkgo/v2/ginkgo -r \
            --randomize-all --randomize-suites --fail-on-pending --race -v \
            --poll-progress-after=25s --poll-progress-interval=25s &
          run_pid=$!
          (
            while kill -0 "$run_pid" 2>/dev/null; do
              sleep 15
              for pid in $(ps -eo pid=,etimes=,args= | awk '$2>120 && /\.test/ && $0 !~ /go[ ]+test[ ]+-c/ {print $1}'); do
                echo "::warning::SIGQUIT stuck suite pid=$pid (deadlock goroutine dump follows)"
                tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true
                echo
                kill -QUIT "$pid" 2>/dev/null || true
                sleep 20
                kill -KILL "$pid" 2>/dev/null || true
              done
            done
          ) &
          watch_pid=$!
          wait "$run_pid"
          rc=$?
          kill "$watch_pid" 2>/dev/null || true
          exit "$rc"
