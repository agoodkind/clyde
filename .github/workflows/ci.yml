name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@main

  project-test:
    name: Project Ginkgo Tests
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Compile the race-instrumented suites first, timed on its own line, so the
      # compile cost is visible separately from the run and this job's Go build
      # cache is warm before the timed run below.
      - name: Compile race suites
        run: time go run github.com/onsi/ginkgo/v2/ginkgo build -r --race
      # Run each suite serially in shuffled order, mirroring ginkgo's serial
      # randomized execution that reproduces the hang, but via `go test` so a
      # deadlocked package hits Go's own -timeout and prints a full goroutine
      # dump directly (no ginkgo output buffering, no process-tree kill needed,
      # which both defeated capture before). The compile step above warms the
      # race build cache so each package run is fast.
      - name: Run race suites
        env:
          GOTRACEBACK: all
        run: |
          set -u
          pkgs=$(go list ./...)
          for trial in 1 2 3 4; do
            echo "::group::shuffled trial $trial"
            for pkg in $(printf '%s\n' "$pkgs" | shuf); do
              if ! go test -race -timeout=50s "$pkg" >/tmp/pkg.out 2>&1; then
                echo "::endgroup::"
                if grep -q "test timed out" /tmp/pkg.out; then
                  echo "::error::DEADLOCK reproduced in ${pkg} (trial ${trial})"
                else
                  echo "::error::failure in ${pkg} (trial ${trial})"
                fi
                cat /tmp/pkg.out
                exit 1
              fi
            done
            echo "::endgroup::"
          done
          echo "no deadlock reproduced across 4 shuffled trials"
