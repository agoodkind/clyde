name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@main

  project-test:
    name: Project Ginkgo Tests
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Compile the race-instrumented suites first, timed on its own line, so the
      # compile cost is visible separately from the run and this job's Go build
      # cache is warm before the timed run below.
      - name: Compile race suites
        run: time go run github.com/onsi/ginkgo/v2/ginkgo build -r --race
      # Run under an external timeout so a hang completes the job (red) instead of
      # being SIGKILLed by the runner cap, which discards the step log. ginkgo's
      # --poll-progress-after prints the running node's full goroutine stacks into
      # stdout every interval, so a deadlock is captured before the timeout ends
      # the run. Running ginkgo directly (not via make) lets `go run` forward the
      # signal to the process.
      - name: Run race suites
        run: |
          timeout --kill-after=90s 12m \
            go run github.com/onsi/ginkgo/v2/ginkgo -r \
            --randomize-all --randomize-suites --fail-on-pending --race \
            --poll-progress-after=25s --poll-progress-interval=25s
