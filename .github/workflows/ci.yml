name: CI

on:
  workflow_dispatch:
  push:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@a9e00ca3f6db26d9fc7dd72e8b8703364372b43e
    with:
      bootstrap_ref: a9e00ca3f6db26d9fc7dd72e8b8703364372b43e
      golangci_lint_install_mode: goinstall
      cgo: true
      submodules: recursive
      darwin_runner: macos-15
      prepare_fetch_depth: 1
      test_shards: |
        [
          {"name": "Daemon", "packages": ["goodkind.io/clyde/internal/daemon"]},
          {"name": "Local backend CLI", "packages": ["goodkind.io/clyde/internal/daemon/localbackendcli"]},
          {"name": "Local backend and status", "packages": [
            "goodkind.io/clyde/internal/daemon/localbackend",
            "goodkind.io/clyde/internal/daemon/statusproof"
          ]},
          {"name": "Remaining packages", "packages": []}
        ]
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets: inherit

  project-test:
    name: Project Race Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOCACHE: ${{ github.workspace }}/.make/ci-go-race
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        id: setup-go
        env:
          GOCACHE: ${{ runner.temp }}/setup-go-build
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Cache compiled race packages
        uses: actions/cache@v6
        with:
          path: ${{ env.GOCACHE }}
          key: clyde-race-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile', 'bootstrap.mk', 'third_party/gksyntax/**') }}
      - name: Native build prerequisites
        run: make native-prereqs
      # Ginkgo issue #871 can hang its CLI on Linux amd64 with race detection.
      # go test runs the same suites. Ginkgo requires -count=1.
      - name: Race tests
        env:
          GOTRACEBACK: all
        run: go test -race -shuffle=on -count=1 -timeout=8m ./...
