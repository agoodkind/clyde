name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@main

  project-test:
    name: Project Ginkgo Tests
    runs-on: ubuntu-latest
    # The runner cap sits above ginkgo's own --timeout (set in the test-ginkgo
    # target) so a hanging spec is aborted by ginkgo with a goroutine dump and the
    # job completes and flushes logs, instead of being SIGKILLed by the runner cap
    # mid-step, which discards the in-progress step's output.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make test-ginkgo
