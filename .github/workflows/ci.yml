name: CI

on:
  workflow_dispatch:
  push:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@main
    with:
      golangci_lint_install_mode: goinstall
      cgo: true
      submodules: recursive
      darwin_runner: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets: inherit

  project-test:
    name: Project Race Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOCACHE: ${{ github.workspace }}/.make/ci-go-race
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        id: setup-go
        env:
          GOCACHE: ${{ runner.temp }}/setup-go-build
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Cache compiled race packages
        uses: actions/cache@v6
        with:
          path: ${{ env.GOCACHE }}
          key: clyde-race-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile', 'bootstrap.mk', 'third_party/gksyntax/**') }}
      - name: Native build prerequisites
        run: make native-prereqs
      - name: Build CLI dependencies for subprocess tests
        run: go build -o "${RUNNER_TEMP}/clyde" ./cmd/clyde
      # Ginkgo issue #871 can hang its CLI on Linux amd64 with race detection.
      # go test runs the same suites. Ginkgo requires -count=1.
      - name: Race tests
        env:
          GOTRACEBACK: all
        run: go test -race -shuffle=on -count=1 -timeout=8m ./...
