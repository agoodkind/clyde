name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@main

  project-test:
    name: Project Ginkgo Tests
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Compile the race-instrumented suites first, timed on its own line, so the
      # compile cost is visible separately from the run and this job's Go build
      # cache is warm before the timed run below.
      - name: Compile race suites
        run: time go run github.com/onsi/ginkgo/v2/ginkgo build -r --race
      # Diagnostic + likely fix: --output-interceptor-mode=none. ginkgo normally
      # pipes each suite's stdout/stderr through an OS pipe and drains it; under
      # -race the heavy slog output can fill that 64KB pipe while ginkgo is busy,
      # blocking the suite's write() forever (a ginkgo-specific, output-volume
      # deadlock that amd64 timing hits and arm64 does not). With interception
      # off, the suite writes straight to the job log, so either the hang
      # disappears (confirming the interceptor) or the suite output (including
      # --poll-progress-after goroutine stacks) streams live and is captured even
      # if the run is later killed. The sidecar still SIGQUITs a suite stuck past
      # 120s so the job completes with a dump rather than the cap discarding it.
      - name: Run race suites
        env:
          GOTRACEBACK: all
        run: |
          go run github.com/onsi/ginkgo/v2/ginkgo -r \
            --randomize-all --randomize-suites --fail-on-pending --race \
            --output-interceptor-mode=none -v \
            --poll-progress-after=25s --poll-progress-interval=25s &
          run_pid=$!
          (
            # The hang lands during the run (compile is ~2min), so at a fixed
            # deadline unconditionally SIGQUIT every Go process by name - the
            # ginkgo CLI and every suite .test - so whichever is wedged prints its
            # full goroutine stacks. With the interceptor off these dumps go
            # straight to this step's stdout/stderr. Then SIGKILL so `wait`
            # returns and the job completes (red) with the dump, instead of
            # hanging to the runner cap which discards the log. pkill by name
            # needs no process groups (which set -m/timeout failed to form here).
            sleep 540
            echo "::warning::deadline reached - SIGQUIT all Go processes for goroutine dumps"
            ps -eo pid=,etimes=,args= | awk '/\.test|onsi\/ginkgo|b[0-9]+\/exe/ {print}' || true
            pkill -QUIT -f '\.test' 2>/dev/null || true
            sleep 3
            pkill -QUIT -f 'onsi/ginkgo|b[0-9]*/exe/ginkgo' 2>/dev/null || true
            sleep 30
            pkill -KILL -f '\.test' 2>/dev/null || true
            pkill -KILL -f 'onsi/ginkgo|b[0-9]*/exe/ginkgo' 2>/dev/null || true
            kill -KILL "$run_pid" 2>/dev/null || true
          ) &
          watch_pid=$!
          wait "$run_pid"
          rc=$?
          kill "$watch_pid" 2>/dev/null || true
          exit "$rc"
