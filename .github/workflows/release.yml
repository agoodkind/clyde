name: Release

# Every push to main publishes a rolling prerelease under a computed timestamp
# tag; pushing a v-prefixed stable semver tag publishes a stable release under
# that tag. Both run the same open-source quill-based primitive in go-makefile's
# reusable workflow (no GoReleaser). go-mk picks the mode from the triggering
# git ref.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    uses: agoodkind/go-makefile/.github/workflows/_release.yml@main
    permissions:
      attestations: write
      contents: write
      id-token: write
    secrets: inherit
    with:
      cgo: true
      binary: clyde

  auto-update-macos:
    name: Auto Update macOS 26
    needs: release
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          cache: false
          go-version-file: go.mod
      - name: Test automatic update
        run: go run ./cmd/ci-auto-update

  auto-update-debian:
    name: Auto Update Debian Trixie
    needs: release
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            ca-certificates \
            gcc \
            git \
            libc6-dev \
            tar
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          cache: false
          go-version-file: go.mod
      - name: Test automatic update
        run: go run ./cmd/ci-auto-update
