name: Release

# Every push to main publishes a rolling prerelease under a computed timestamp
# tag; pushing a v* tag publishes a stable release under that tag. Both run the
# same open-source quill-based primitive in go-makefile's reusable workflow
# (no GoReleaser). go-mk picks the mode from the triggering git ref.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    uses: agoodkind/go-makefile/.github/workflows/_release.yml@main
    permissions:
      contents: write
    secrets: inherit
