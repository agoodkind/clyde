# Reference [adapter] stanza for ~/.config/clyde/config.toml.
#
# Copy sections into your
# config; the adapter refuses to start when required tables are
# missing ([adapter.model_profiles], [adapter.models], [adapter.client_identity],
# [adapter.anthropic.oauth]
# when direct_oauth = true).
#
# Bootstrap:
#   cat clyde.example.toml >> ~/.config/clyde/config.toml
#   $EDITOR ~/.config/clyde/config.toml
#   launchctl kickstart -k gui/$UID/io.goodkind.clyde
#
# Operator note: [adapter.anthropic.oauth] and the stainless/* / cc_* fields under
# [adapter.client_identity] must match the canonical desktop client you
# use for login (capture from your environment or vendor docs).

[logging]
level = "debug"

# Transcripts written by a dispatched agent are indexed only when this is true.
# They are hidden by default because one working session can write hundreds of
# them in a day. Changing it needs no cache deletion.
[conversation]
include_subagent_conversations = false

[conversation.semantic]
# Offer conversations to the search engine. This embeds text, so it occupies the
# GPU and grows the store. Turning it off stops new embedding and leaves
# everything already stored searchable.
enabled = false
# Answer conversation searches from the engine. Reading queries a corpus that
# already exists and costs nothing, so this stays on when enabled is off. Omit
# the key for that default; set it false to stop answering searches as well.
search_enabled = true
socket_path = ""
collection_id = "clyde-conversations"
# Content kinds offered to the search engine, using the same selector names the
# export surface accepts. Omit the key for this default, which is the chat turns
# plus tool calls without their results. The three tool kinds are nested rather
# than parallel: "tools" is names only, "tool_calls" adds the command and
# arguments, and "tool_outputs" adds what the tool returned. Name "thinking",
# "system_messages", or "tool_outputs" here to index those too. Use
# enabled = false to stop indexing entirely; an empty list means the default.
indexed_content = ["chat", "tool_calls"]


[logging.rotation]
enabled = true
max_size_mb = 64
max_backups = 192
max_age_days = 14
compress = false

# Logging sinks. The canonical sink names are: daemon, cli, codex_sidecar,
# anthropic_sidecar, audit, concerns, transcripts, inventory_index.
# Each sink is enabled by default (transcripts additionally requires
# logging.transcript.enabled). MITM wire events land in the per-concern file
# logs/providers/mitm/wire.jsonl via the concerns sink; full MITM request and
# response bodies persist to mitm/capture.db (see [mitm.capture_store]).
#
# Back-compatible flat form: restrict the active sink set to an explicit
# allowlist. When set, only the listed sinks stay enabled.
#
# [logging.sinks]
# enabled = ["daemon", "cli", "concerns", "inventory_index"]
#
# Per-sink table form: configure one sink at a time with its own enabled flag,
# level, path, and rotation. Each sink inherits the global [logging.rotation]
# block above unless its own [logging.sinks.<name>.rotation] table overrides a
# field. The flat allowlist and the per-sink tables can be used together; an
# explicit [logging.sinks.<name>] enabled value wins over the flat allowlist for
# that sink.
#
# [logging.sinks.audit]
# enabled = true
# level = "warn"
# [logging.sinks.audit.rotation]
# enabled = true
# max_size_mb = 16
# max_backups = 6
# max_age_days = 3
# compress = true
#
# [logging.sinks.anthropic_sidecar]
# enabled = true
# [logging.sinks.anthropic_sidecar.rotation]
# enabled = true
# max_size_mb = 32
# max_backups = 12
# max_age_days = 3
# compress = true

# Optional per-process log file overrides.
# Defaults:
#   CLI commands   -> $XDG_STATE_HOME/clyde/clyde-cli.jsonl
#   daemon command -> $XDG_STATE_HOME/clyde/clyde-daemon.jsonl
[logging.paths]
cli = ""
daemon = ""
[adapter]
enabled = true
direct_oauth = true
# Persist the raw OpenAI-shape ingress request and the rendered reply to
# capture.db tagged client="adapter.ingress", alongside the always-on BYOK
# egress capture. Off by default; it roughly doubles body volume against the
# [mitm.capture_store] retention cap. Requires the capture store to be open.
capture_ingress = false
# Provider-neutral list of capability tokens to drop from the outbound provider
# capability header on egress (anthropic-beta on the Claude path,
# x-codex-beta-features and openai-beta on the Codex path). Default empty replays
# the learned wire identity untouched. Listing a token a provider requires for
# its handshake will break that provider, so name only tokens the backend
# tolerates dropping. The placeholders below stand in for the real provider
# tokens, which are vendor-specific and belong only in your local config, not in
# this committed example; one use is dropping a provider's thinking-redaction
# capability so Cursor receives plaintext reasoning.
# strip_wire_flags = ["example-capability-flag-a", "example-capability-flag-b"]
# The default is an exact configured alias. Exact aliases take precedence over
# wildcard routes.
default_model = "clyde-fable-5-high-thinking"
# Optional second adapter listener for Cursor BYOK. When set, requests arriving
# on this port are tagged ingress=cursor while the primary port (default 11434)
# is tagged ingress=openai, separating Cursor traffic from generic
# OpenAI-compatible clients and keeping Cursor on the dual-surface streaming
# reasoning path. The primary listener stays generic and emits
# reasoning_content-only streaming reasoning. Omit to bind only the primary
# port.
cursor_ingress_port = 11435

[adapter.notices]
enabled = true

[adapter.codex]
enabled = true

# Reusable exact-model capability profiles. Transport limits report the same
# context budget used by the selected Codex transport.
[adapter.model_profiles."codex-1m"]
contexts = [{ name = "1m", tokens = 1000000, alias_suffix = "1m", transport_limits = [{ transport = "codex_http", tokens = 272000 }, { transport = "codex_websocket", tokens = 1000000 }] }]
max_output_tokens = 128000
reasoning_efforts = ["low", "medium", "high", "xhigh"]
default_effort = "medium"
supports_tools = true
supports_vision = true

[adapter.model_profiles."codex-272k"]
contexts = [{ name = "standard", tokens = 272000, transport_limits = [{ transport = "codex_http", tokens = 272000 }, { transport = "codex_websocket", tokens = 272000 }] }]
max_output_tokens = 128000
reasoning_efforts = ["low", "medium", "high", "xhigh"]
default_effort = "medium"
supports_tools = true
supports_vision = true

[adapter.models."gpt-5.4"]
provider = "codex"
wire_model = "gpt-5.4"
profile = "codex-1m"
advertise = true
# Optional: prepend a shared developer instruction file before any caller
# system message. Paths resolve relative to this config.toml.
# instructions_file = "prompts/gpt-5.4.md"
generated_aliases = { prefix = "clyde-gpt-5.4", advertise = true, dimensions = ["context", "reasoning_effort"] }

[adapter.models."gpt-5.5"]
provider = "codex"
wire_model = "gpt-5.5"
profile = "codex-272k"
advertise = true
aliases = [{ id = "gpt-5.5-extra", advertise = true, reasoning_effort = "xhigh" }]
generated_aliases = { prefix = "clyde-codex-5.5", advertise = true, dimensions = ["reasoning_effort"] }

# Ordered full-string provider claims preserve undeclared future model IDs and
# caller-supplied optional controls. Wildcard matches route but are not listed
# by /v1/models.
[[adapter.model_routes]]
match = "gpt-*"
surfaces = ["cursor", "openai"]
provider = "codex"
wire_model_policy = "preserve"
capability_policy = "passthrough"

[[adapter.model_routes]]
match = "claude-*"
surfaces = ["cursor", "openai", "anthropic"]
provider = "anthropic"
wire_model_policy = "preserve"
capability_policy = "passthrough"

# Optional: forward otherwise-unknown model aliases to one
# OpenAI-compatible upstream. The caller's model value is preserved unless
# model is set.
[adapter.openai_compat_passthrough]
base_url = "http://[::1]:1234/v1"
api_key = ""
api_key_env = ""
model = ""

# Optional: route specific model aliases to named passthrough overrides.
# Use provider = "passthrough_override" when you want the model entry to
# be explicit even if passthrough_override is present.
# [adapter.passthrough_overrides.local]
# base_url = "http://localhost:1234/v1"
# api_key = ""
# api_key_env = ""
# model = "local-model"
#
# [adapter.model_profiles.local]
# contexts = [{ name = "standard", tokens = 8192 }]
# max_output_tokens = 4096
# supports_tools = true
# supports_vision = false
#
# [adapter.models."gpt-local"]
# provider = "passthrough_override"
# wire_model = "local-model"
# profile = "local"
# passthrough_override = "local"

[adapter.anthropic.oauth]
token_url = "https://REDACTED-OAUTH-HOST/v1/oauth/token"
messages_url = "https://REDACTED-UPSTREAM/v1/messages"
client_id = "REDACTED-CLIENT-ID"
anthropic_beta = "REDACTED-OAUTH-BETA"
anthropic_version = "2023-06-01"
keychain_service = "REDACTED-KEYCHAIN"
scopes = [
  "user:profile",
  "user:inference",
  "user:sessions:claude_code",
  "user:mcp_servers",
  "user:file_upload",
]

[adapter.client_identity]
user_agent = "REDACTED-UA"
system_prompt_prefix = "REDACTED-SYSTEM-PREFIX"
stainless_package_version = "0.81.0"
stainless_runtime = "node"
stainless_runtime_version = "v24.3.0"
cc_version = "2.1.114"
cc_entrypoint = "sdk-cli"

# Per-backend handling of the OpenAI logprobs / top_logprobs
# request fields. "reject" returns 400 when the caller sets
# logprobs; "drop" silently strips the field. OpenAI-compatible
# passthrough routes pass through verbatim regardless of this stanza.
[adapter.logprobs]
anthropic = "reject"

# opus-4-6: adaptive/default/enabled/disabled thinking, low/medium/high/max
# effort, 200k and 1M context. Claude Code upstream names this exact family
# "claude-opus-4-6". Verified against bundled upstream docs 2026-04-24.
# The anthropic transport limit is a safe-window cap Clyde surfaces to
# OpenAI-compatible clients and uses during request preflight.
[adapter.model_profiles."anthropic-opus-4-6"]
supports_tools = true
supports_vision = true
reasoning_efforts = ["low", "medium", "high", "max"]
default_effort = "high"
max_output_tokens = 128000
contexts = [
  { name = "standard", tokens = 200000, alias_suffix = "standard", transport_limits = [{ transport = "anthropic", tokens = 180000 }] },
  { name = "1m", tokens = 1000000, alias_suffix = "1m", wire_suffix = "[1m]", transport_limits = [{ transport = "anthropic", tokens = 900000 }] },
]

[adapter.model_profiles."anthropic-opus-4-6".thinking_profiles.adaptive]
mode = "adaptive"

[adapter.model_profiles."anthropic-opus-4-6".thinking_profiles.enabled]
mode = "enabled"
budget_tokens = 127999

[adapter.model_profiles."anthropic-opus-4-6".thinking_profiles.disabled]
mode = "disabled"

[adapter.models."claude-opus-4-6"]
provider = "anthropic"
wire_model = "claude-opus-4-6"
profile = "anthropic-opus-4-6"
advertise = true
generated_aliases = { prefix = "clyde-opus-4-6", advertise = true, dimensions = ["context", "reasoning_effort"] }

# opus-4-8: Claude Opus 4.8 (id "claude-opus-4-8"). 1M context, 128k max
# output, $5/$25 per MTok in/out, adaptive thinking. low/medium/high/max
# effort, all four thinking modes, 200k and 1M context. Verified against
# the Claude API models overview 2026-05-28.
# The adaptive thinking profile is explicit because the registry does not
# infer provider wire shapes from model names.
[adapter.model_profiles."anthropic-opus-4-8"]
# Optional: prepend a shared developer instruction file before any caller
# system message. Paths resolve relative to this config.toml.
supports_tools = true
supports_vision = true
reasoning_efforts = ["low", "medium", "high", "max"]
default_effort = "high"
max_output_tokens = 128000
contexts = [
  { name = "standard", tokens = 200000, alias_suffix = "standard", transport_limits = [{ transport = "anthropic", tokens = 180000 }] },
  { name = "1m", tokens = 1000000, alias_suffix = "1m", wire_suffix = "[1m]", transport_limits = [{ transport = "anthropic", tokens = 900000 }] },
]

[adapter.model_profiles."anthropic-opus-4-8".thinking_profiles.adaptive]
mode = "adaptive"

[adapter.model_profiles."anthropic-opus-4-8".thinking_profiles.enabled]
mode = "enabled"
budget_tokens = 127999

[adapter.model_profiles."anthropic-opus-4-8".thinking_profiles.disabled]
mode = "disabled"

[adapter.models."claude-opus-4-8"]
provider = "anthropic"
wire_model = "claude-opus-4-8"
profile = "anthropic-opus-4-8"
advertise = true
# instructions_file = "prompts/opus-4-8.md"
pricing = { input_per_mtok = 5.0, output_per_mtok = 25.0, cache_write_per_mtok = 6.25, cache_read_per_mtok = 0.50 }
generated_aliases = { prefix = "clyde-opus-4-8", advertise = true, dimensions = ["context", "reasoning_effort"] }

# fable-5 uses a named adaptive thinking profile because the provider rejects
# disabled thinking. Its exact thinking alias binds that profile explicitly.
# The 1m context also keeps the base wire model because the provider rejects a
# bracketed model suffix.
[adapter.model_profiles."anthropic-fable-5"]
supports_tools = true
supports_vision = true
reasoning_efforts = ["low", "medium", "high", "xhigh", "max"]
default_effort = "high"
max_output_tokens = 128000
contexts = [
  { name = "standard", tokens = 200000, alias_suffix = "standard", transport_limits = [{ transport = "anthropic", tokens = 180000 }] },
  { name = "1m", tokens = 1000000, alias_suffix = "1m", transport_limits = [{ transport = "anthropic", tokens = 900000 }] },
]

[adapter.model_profiles."anthropic-fable-5".thinking_profiles.thinking]
mode = "adaptive"

[adapter.model_profiles."anthropic-fable-5".thinking_profiles.enabled]
mode = "enabled"
budget_tokens = 127999

[adapter.models."claude-fable-5"]
provider = "anthropic"
wire_model = "claude-fable-5"
profile = "anthropic-fable-5"
advertise = true
aliases = [{ id = "clyde-fable-5-high-thinking", advertise = true, reasoning_effort = "high", context = "standard", thinking_profile = "thinking" }]
pricing = { input_per_mtok = 10.0, output_per_mtok = 50.0, cache_write_per_mtok = 12.50, cache_read_per_mtok = 1.00 }
generated_aliases = { prefix = "clyde-fable-5", advertise = true, dimensions = ["context", "reasoning_effort"] }

# sonnet-4-6: same effort + thinking matrix as opus-4-7, single
# 200k context. Verified 2026-04-18.
[adapter.model_profiles."anthropic-sonnet-4-6"]
supports_tools = true
supports_vision = true
reasoning_efforts = ["low", "medium", "high", "max"]
default_effort = "high"
max_output_tokens = 64000
contexts = [
  { name = "standard", tokens = 200000, transport_limits = [{ transport = "anthropic", tokens = 180000 }] },
]

[adapter.model_profiles."anthropic-sonnet-4-6".thinking_profiles.adaptive]
mode = "adaptive"

[adapter.model_profiles."anthropic-sonnet-4-6".thinking_profiles.enabled]
mode = "enabled"
budget_tokens = 63999

[adapter.model_profiles."anthropic-sonnet-4-6".thinking_profiles.disabled]
mode = "disabled"

[adapter.models."claude-sonnet-4-6"]
provider = "anthropic"
wire_model = "claude-sonnet-4-6"
profile = "anthropic-sonnet-4-6"
advertise = true
generated_aliases = { prefix = "clyde-sonnet-4-6", advertise = true, dimensions = ["reasoning_effort"] }

# haiku-4-5: server rejects effort
# (`400 This model does not support the effort parameter`) and
# adaptive thinking. Enabled and disabled thinking work; default
# omits the block. Verified 2026-04-18.
[adapter.model_profiles."anthropic-haiku-4-5"]
supports_tools = true
supports_vision = true
max_output_tokens = 16000
contexts = [
  { name = "standard", tokens = 200000, transport_limits = [{ transport = "anthropic", tokens = 180000 }] },
]

[adapter.model_profiles."anthropic-haiku-4-5".thinking_profiles.enabled]
mode = "enabled"
budget_tokens = 15999

[adapter.model_profiles."anthropic-haiku-4-5".thinking_profiles.disabled]
mode = "disabled"

[adapter.models."claude-haiku-4-5-20251001"]
provider = "anthropic"
wire_model = "claude-haiku-4-5-20251001"
profile = "anthropic-haiku-4-5"
advertise = true
aliases = [{ id = "claude-haiku-4-5", advertise = true }]

[mitm]
providers = ["claude", "codex", "conductor", "cursor"]

# sentinel = "MYKEYWORD"
# actual_user_sentinel = "ACTUAL_USER"

# Per-client MITM listeners, split into CLIs ([mitm.cli.<name>]) and desktop apps
# ([mitm.app.<name>]). The table key is the client name; each gets its own
# loopback port so every captured exchange in mitm/capture.db is tagged with the
# originating client. The id lands in the capture `client` column as the
# group-qualified "cli.<name>" / "app.<name>", so the same leaf name (codex) can
# appear in both groups. One traffic type per port keeps the `client` tag
# unambiguous. The full map is the [mitm.cli.*] and [mitm.app.*] blocks below.

# CLI model-API base URLs (passthrough; these capture the wire baseline source).
[mitm.cli.claude-code]
host = "localhost"
port = 48723

[mitm.cli.codex]
host = "localhost"
port = 48724

# CLI everything-else via HTTPS_PROXY (telemetry, updates, and so on).
[mitm.cli.claude-code-proxy]
host = "localhost"
port = 48728

[mitm.cli.codex-proxy]
host = "localhost"
port = 48729

# Codex CLI chatgpt_base_url backend (auth, cloud, analytics; codex auth bypasses
# HTTPS_PROXY, so this is the only listener that captures it).
[mitm.cli.codex-backend]
host = "localhost"
port = 48730

# Desktop Electron shells (the apps' own non-CLI traffic; the embedded CLI rides
# the cli.* listeners above).
[mitm.app.cursor]
host = "localhost"
port = 48725

[mitm.app.claude]
host = "localhost"
port = 48726

[mitm.app.codex]
host = "localhost"
port = 48727

[mitm.app.conductor]
host = "localhost"
port = 48731

# MITM baseline / drift loop.
#
# The loop closes the cycle capture -> baseline refresh -> drift log:
# every captured request to a known upstream debounces a baseline refresh,
# and the daemon also runs a periodic compare-only drift check that diffs
# the current local capture store against a pinned reference snapshot and
# appends the outcome to <drift_log_dir>/<upstream>.jsonl. Operators enable
# the loop by adding this [mitm.drift] block; with enabled = false (or the
# block absent) nothing runs.
[mitm.drift]
enabled = true
interval = "5m"
drift_log_dir = "~/.local/state/clyde/mitm-drift"
capture_root = "~/.local/state/clyde/mitm"

[mitm.drift.upstreams.claude-code]
reference = "~/.local/state/clyde/mitm-baselines/claude-code/baseline-reference.toml"
include_ua = ["claude-cli"]

[mitm.drift.upstreams.codex-cli]
reference = "~/.local/state/clyde/mitm-baselines/codex-cli/baseline-reference.toml"
include_ua = ["codex_cli_rs", "codex-tui"]
